name: Build Release Artifacts

# 手动触发 + 推送到主分支时构建（不自动打 tag；tag 推送时也可构建但绝不创建新 tag）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本后缀（留空则用 package.json 中的 version）"
        required: false
        default: ""
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: moovn-windows
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: moovn-linux
          - os: macos-14
            bundles: dmg,app
            artifact: moovn-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf rpm libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Generate icons (if missing)
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/icon.ico ]; then
            python3 -m pip install --quiet pillow || pip3 install --quiet pillow
            python3 scripts/gen-icons.py || npx tauri icon src-tauri/icons/app-icon.jpg
          fi

      - name: npm install & typecheck & frontend build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Tauri build (installers)
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Package ZIP portable + collect artifacts
        run: node scripts/zip-portable.mjs
        env:
          MOOVN_VERSION: ${{ github.event.inputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*
            !release/SHA256SUMS.txt
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Java Android compat workaround (tauri#10073)
        run: echo "JAVA_TOOL_OPTIONS=-Djdk.util.zip.disableZip64ExtraFieldValidation=true" >> "$GITHUB_ENV"
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm ci && npm run build
      - name: Init Android project
        working-directory: src-tauri
        run: npx tauri android init
      - name: Build APK (debug signing in CI without keystore)
        working-directory: src-tauri
        run: npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: moovn-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/universal*.apk
          if-no-files-found: warn

  # 注意：本工作流只“构建”与“上传产物”。
  # 按仓库规范，不自动创建 git tag；如需 GitHub Release，请人工打 tag 后再单独运行发布流程。
