name: MooVN Multi-Platform Build (v0.1.0-dev)

# ============================================================================
# 仅针对 v0.1.0-dev 及开发分支生效，绝不覆盖或触发 main 分支（main 仅放介绍文件）
# 仅支持手动触发 (workflow_dispatch)，推送代码时不自动触发编译
# 同分支并发控制：若同一分支开启新 Action 且上个 Action 仍在跑，立即停止上个 Action
# 输出产物：Web (包含 PC 和 Mobile)、Android、Windows、iOS、macOS
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "选择编译目标平台 (all / web / windows / android / ios / macos)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - web
          - windows
          - android
          - ios
          - macos

permissions:
  contents: read
  actions: write

# 如果开启一个新 Action，且上个同分支的 Action 还在跑，立即停止上个这个分支的 Action
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Web 构建 (同时包含 PC 桌面端与 Mobile 移动端响应式 Web 编译包)
  # ============================================================================
  build-web:
    name: Build Web (PC & Mobile)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'web' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web bundle (PC & Mobile)
        run: npm run build

      - name: Upload Web (PC & Mobile) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Web-PC-and-Mobile
          path: dist/
          if-no-files-found: error

  # ============================================================================
  # 2. Windows 编译器构建 (.msi & NSIS .exe)
  # ============================================================================
  build-windows:
    name: Build Windows (MSI & NSIS .exe)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Build Windows Application (NSIS & MSI)
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/moovn.exe

  # ============================================================================
  # 3. macOS 编译器构建 (.dmg & .app)
  # ============================================================================
  build-macos:
    name: Build macOS (.dmg & .app)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'macos' }}
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Build macOS Universal Application
        run: npx tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Zip macOS .app bundle for artifact preservation
        run: |
          mkdir -p release/macos
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release/macos/ || true
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/MooVN.app" ]; then
            ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/MooVN.app" "release/macos/MooVN-macOS-Universal.app.zip"
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-macOS-Universal
          path: release/macos/*

  # ============================================================================
  # 4. Android 编译器构建 (APK)
  # ============================================================================
  build-android:
    name: Build Android (APK)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'android' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Java Android compat workaround (tauri#10073)
        run: echo "JAVA_TOOL_OPTIONS=-Djdk.util.zip.disableZip64ExtraFieldValidation=true" >> "$GITHUB_ENV"

      - name: Install Linux host deps for Tauri build script
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Configure Android SDK & NDK from pre-installed Ubuntu runner
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            LATEST_NDK=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              echo "NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
              echo "ANDROID_NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
            fi
          else
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Initialize Tauri Android project
        working-directory: src-tauri
        run: npx tauri android init

      - name: Build Android APK (Debug signed for CI)
        working-directory: src-tauri
        run: npx tauri android build --apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Android-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # ============================================================================
  # 5. iOS 编译器构建 (Xcode App / IPA & Project Bundle)
  # ============================================================================
  build-ios:
    name: Build iOS (App / IPA)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'ios' }}
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Build frontend dist
        run: npm run build

      - name: Initialize Tauri iOS project
        working-directory: src-tauri
        run: npx tauri ios init

      - name: Build iOS App (unsigned CI build + Xcode project archive)
        continue-on-error: true
        working-directory: src-tauri
        run: npx tauri ios build --export-method development --ci

      - name: Package iOS Artifacts
        run: |
          mkdir -p release/ios
          if [ -d "src-tauri/gen/apple/build" ]; then
            find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} release/ios/ \; || true
            find src-tauri/gen/apple/build -name "*.app" -exec ditto -c -k --keepParent {} release/ios/MooVN-iOS.app.zip \; || true
          fi
          if [ -d "src-tauri/gen/apple" ]; then
            ditto -c -k --keepParent src-tauri/gen/apple release/ios/MooVN-iOS-XcodeProject.zip
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-iOS-Build
          path: release/ios/*
