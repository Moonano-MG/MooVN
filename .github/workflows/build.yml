name: MooVN Multi-Platform Build (Web / Windows / Android / iOS / macOS)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - v0.1.0-dev
  workflow_dispatch:
    inputs:
      build_target:
        description: "选择编译目标平台 (all / web / windows / android / ios / macos)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - web
          - windows
          - android
          - ios
          - macos

# 如果同一分支开启了新 Action，且上一个该分支的 Action 仍在运行，则自动停止上一个 Action
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Web 构建 (同时包含 PC 桌面端与 Mobile 移动端响应式 Web 编译包)
  # ============================================================================
  build-web:
    name: Build Web (PC & Mobile)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web bundle (PC & Mobile)
        run: npm run build

      - name: Upload Web (PC & Mobile) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Web-PC-and-Mobile
          path: dist/
          if-no-files-found: error

  # ============================================================================
  # 2. Windows 编译器构建 (.msi & NSIS .exe)
  # ============================================================================
  build-windows:
    name: Build Windows (MSI & NSIS .exe)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Build Windows Application
        run: npx tauri build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/moovn.exe

  # ============================================================================
  # 3. macOS 编译器构建 (Universal .app & .dmg)
  # ============================================================================
  build-macos:
    name: Build macOS (Universal .dmg & .app)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Build macOS Universal Application
        run: npx tauri build --target universal-apple-darwin

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  # ============================================================================
  # 4. Android 编译器构建 (APK & AAB)
  # ============================================================================
  build-android:
    name: Build Android (APK & AAB)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build-Tools
        run: |
          sdkmanager --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Initialize & Build Tauri Android (APK & AAB)
        run: |
          npx tauri android init
          npx tauri android build --apk --aab

      - name: Upload Android APK & AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-Android-APK-and-AAB
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  # ============================================================================
  # 5. iOS 编译器构建 (Xcode Archive / Unsigned IPA & App)
  # ============================================================================
  build-ios:
    name: Build iOS (App & Unsigned IPA)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install XcodeGen & CocoaPods
        run: brew install xcodegen cocoapods

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icon.png

      - name: Initialize Tauri iOS project & Build
        run: |
          npx tauri ios init
          npm run build
          cd src-tauri/gen/apple
          xcodebuild -project moovn.xcodeproj -scheme moovn_iOS -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build SYMROOT="$(pwd)/build"
          mkdir -p Payload
          cp -r build/Release-iphoneos/moovn.app Payload/ || cp -r build/Release-iphoneos/*.app Payload/
          zip -r moovn-ios-unsigned.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MooVN-iOS-Unsigned-IPA
          path: |
            src-tauri/gen/apple/moovn-ios-unsigned.ipa
            src-tauri/gen/apple/build/Release-iphoneos/*.app
