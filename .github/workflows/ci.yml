name: Quality checks

# No push, pull request or scheduled runs. All checks and builds are initiated
# explicitly by the repository operator; this workflow publishes no releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            MooVN Studio/package-lock.json
            MooVN Web/package-lock.json
      - name: Install Studio dependencies
        working-directory: MooVN Studio
        run: npm ci
      - name: Install Web dependencies
        working-directory: MooVN Web
        run: npm ci
      # The entire workflow is manual-only, including these tests.
      - name: Test Studio
        working-directory: MooVN Studio
        run: npm test
      - name: Test Web
        working-directory: MooVN Web
        run: npm test
      - name: Studio TypeScript check (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npx tsc --noEmit
      - name: Build Studio (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run build
      - name: Build Web (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Web
        run: npm run build
      - name: Verify Web builds without Studio node_modules (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Web
        run: npm run test:isolated-build
      - name: Install Chromium for browser regression tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:e2e
      - name: Browser project and chapter file tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:formats:e2e
      - name: Browser remote media privacy (Studio, manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:remote-media:e2e
      - name: Browser remote media privacy (Web, manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Web
        run: npm run test:remote-media:e2e
      - uses: dtolnay/rust-toolchain@stable
      - name: Browser and native asset I/O regression (manual, simulated IPC)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:native-assets:e2e
      - name: Browser test built Web assets (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:web-production:e2e
      - name: Attach browser screenshots (manual)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-screenshots
          path: |
            MooVN Studio/test-results/browser-smoke/
            MooVN Studio/test-results/browser-formats/
            MooVN Studio/test-results/browser-native-assets/
            MooVN Studio/test-results/browser-remote-media/
            MooVN Web/test-results/browser-remote-media/
            MooVN Studio/test-results/browser-web-production/
          if-no-files-found: warn

  engine:
    name: Engine and workspace I/O tests (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust engine tests
        working-directory: MooVN Engine
        run: cargo test
      - name: C++ bridge compile
        working-directory: MooVN Engine
        run: g++ -std=c++20 -Wall -Wextra -Icpp/include -c cpp/src/moovn_renderer_bridge.cpp -o /tmp/moovn_renderer_bridge.o
      - name: Workspace and asset I/O unit tests
        working-directory: MooVN Studio
        run: cargo test --locked --manifest-path tests/native-io/Cargo.toml

  windows-tauri:
    name: Windows Tauri tests and installed startup (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MooVN Studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./MooVN Studio/src-tauri -> target
      - name: Install and build frontend
        working-directory: MooVN Studio
        run: |
          npm ci
          npm run build
      - name: Compile Tauri and run native tests
        working-directory: MooVN Studio/src-tauri
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          # Keep the real exit status; publish a diagnostic annotation so the
          # failure is visible even when a reviewer lacks Actions-log access.
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'tauri-cargo-test.log'
          cargo test 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($null -eq $status) { throw 'cargo test did not return an exit status' }
          if ($status -ne 0) {
            $summary = ((Get-Content $log | Select-Object -Last 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Tauri cargo test failed::$summary"
            exit $status
          }
      - name: Test startup gate failure handling
        working-directory: MooVN Studio
        run: node --experimental-strip-types --test tests/windows-startup-smoke.test.mts
      - name: Generate Tauri icons
        working-directory: MooVN Studio
        run: npx tauri icon public/icon.png
      - name: Build NSIS installer for startup test
        working-directory: MooVN Studio
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Install NSIS and smoke-test the actual desktop UI
        working-directory: MooVN Studio
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer to test.' }
          node scripts/windows-startup-smoke.mjs "$($installer[0].FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
