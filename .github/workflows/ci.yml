name: Quality checks

# No push, pull request or scheduled runs. All checks and builds are initiated
# explicitly by the repository operator; this workflow publishes no releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            MooVN Studio/package-lock.json
            MooVN Web/package-lock.json
      - name: Install Studio dependencies
        working-directory: MooVN Studio
        run: npm ci
      - name: Install Web dependencies
        working-directory: MooVN Web
        run: npm ci
      # The entire workflow is manual-only, including these tests.
      - name: Test Studio
        working-directory: MooVN Studio
        run: npm test
      - name: Test Web
        working-directory: MooVN Web
        run: npm test
      - name: Studio TypeScript check (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npx tsc --noEmit
      - name: Build Studio (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run build
      - name: Build Web (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Web
        run: npm run build
      - name: Install Chromium for browser regression tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npx playwright-core install --with-deps chromium
      - name: Browser regression tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:e2e
      - name: Browser project and chapter file tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: MooVN Studio
        run: npm run test:formats:e2e
      - name: Attach browser screenshots (manual)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-screenshots
          path: |
            MooVN Studio/test-results/browser-smoke/
            MooVN Studio/test-results/browser-formats/
          if-no-files-found: warn

  engine:
    name: Engine and workspace I/O tests (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust engine tests
        working-directory: MooVN Engine
        run: cargo test
      - name: C++ bridge compile
        working-directory: MooVN Engine
        run: g++ -std=c++20 -Wall -Wextra -Icpp/include -c cpp/src/moovn_renderer_bridge.cpp -o /tmp/moovn_renderer_bridge.o
      - name: Workspace and asset I/O unit tests
        working-directory: MooVN Studio
        run: |
          rustc --edition=2021 --test tests/workspace-io-harness.rs -o /tmp/workspace-io-tests
          /tmp/workspace-io-tests

  windows-tauri:
    name: Windows Tauri compile and Rust tests (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MooVN Studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./MooVN Studio/src-tauri -> target
      - name: Install and build frontend
        working-directory: MooVN Studio
        run: |
          npm ci
          npm run build
      - name: Compile Tauri and run native tests
        working-directory: MooVN Studio/src-tauri
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          # Keep the real exit status; publish a diagnostic annotation so the
          # failure is visible even when a reviewer lacks Actions-log access.
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'tauri-cargo-test.log'
          cargo test 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($null -eq $status) { throw 'cargo test did not return an exit status' }
          if ($status -ne 0) {
            $summary = ((Get-Content $log | Select-Object -Last 60) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Tauri cargo test failed::$summary"
            exit $status
          }
