[package]
name = "moovn"
version = "0.1.0"
description = "MooVN Visual Novel Editor & Cross-Platform Engine (Windows, Android, iOS, macOS)"
authors = ["Moonano-MG"]
license = "GPL-3.0"
repository = "https://github.com/Moonano-MG/MooVN"
edition = "2021"

[lib]
name = "moovn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
