[package]
name = "moovn"
version = "0.1.0"
description = "MooVN 视觉小说编辑器 — 工作流式可视化编辑 + 多语言脚本支持"
authors = ["Moonano"]
license = "MIT"
repository = "https://github.com/Moonano-MG/MooVN"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moovn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
